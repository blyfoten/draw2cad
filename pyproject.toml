[project]
name = "draw2cad"
version = "0.1.0"
description = "Convert scanned and hand-drawn floor plans to clean, layered DXF/DWG"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "ezdxf>=1.3",
    "shapely>=2.0",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "pillow>=10.1",
    "pymupdf>=1.24",
    "rapidocr-onnxruntime>=1.3",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "anthropic>=1.0",
    "mcp>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["draw2cad*", "bench*"]

[tool.setuptools.package-data]
draw2cad = ["standards/*.yaml", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
